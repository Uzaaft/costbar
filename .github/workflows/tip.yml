name: Publish tip

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: publish-tip
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-14

    steps:
      - name: Check out HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Restore and save the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Verify Developer ID identity
        run: |
          set -euo pipefail
          security find-identity -v -p codesigning
          security find-identity -v -p codesigning \
            | grep -F "Developer ID Application"

      - name: Store notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials costbar \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Build, sign, and publish tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix develop --accept-flake-config --command nu dist/release.nu --notarize --keychain-profile costbar --publish
